# =========================================================================
# NGINX CONFIG 3: API & UPLOADS SUBDOMAIN (api.blackpanther-batteries.com)
# =========================================================================
# Place in: /etc/nginx/sites-available/blackpanther-api
# Link to:  sudo ln -s /etc/nginx/sites-available/blackpanther-api /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name api.blackpanther-batteries.com;

    # Maximum upload size for images (allow up to 20MB)
    client_max_body_size 20M;

    # 3A. PROXY ALL API REQUESTS TO NODE.JS EXPRESS BACKEND (Port 1500)
    location / {
        proxy_pass http://127.0.0.1:1500;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # 3B. SERVE & PROXY UPLOADED IMAGES
    location /uploads/ {
        proxy_pass http://127.0.0.1:1500/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Cache images in browser for 30 days
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
